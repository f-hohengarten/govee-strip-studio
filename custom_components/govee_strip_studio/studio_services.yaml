# Strip Studio actions (own file; tools/sync_upstream.py appends it to upstream's services.yaml).

play_studio_effect:
  name: Strip-Studio-Effekt abspielen
  description: Spielt einen in Strip Studio gespeicherten Effekt (auch Darts-Effekte) auf dem Streifen ab.
  target: {entity: {integration: govee_strip_studio, domain: light}}
  fields:
    effect:
      name: Effekt
      description: Name des gespeicherten Effekts, wie er in Strip Studio steht (Groß-/Kleinschreibung egal).
      required: true
      example: Abendwelle
      selector: {text:}

stop_studio_effect:
  name: Strip-Studio-Effekt stoppen
  description: Beendet den laufenden Strip-Studio-Effekt. Der Streifen behält das zuletzt gezeigte Bild.
  target: {entity: {integration: govee_strip_studio, domain: light}}

set_darts_mode:
  name: Darts-Modus schalten
  description: Schaltet den Darts-Modus an (Verbindung zu darts-caller, Würfe steuern den Streifen) oder aus.
  fields:
    enabled:
      name: An
      required: true
      selector: {boolean:}
